name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.group }}
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc:latest
    strategy:
      fail-fast: false
      matrix:
        group: [classics, capcom, neogeo, segakonami, vtech]
    steps:
      - name: Install tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git make zip python3 ca-certificates
          dkp-pacman -Syu --noconfirm wii-dev

      - uses: actions/checkout@v4

      - name: Build
        run: |
          git config --global --add safe.directory '*'
          ./build.sh ${{ matrix.group }}

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.group }}
          path: dist/
          if-no-files-found: error

  package:
    name: Package
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: parts
          merge-multiple: true

      - name: Create release zip
        run: |
          VERSION=$(sed -n 's/^#define MAME4WII_VERSION *"\(.*\)"/\1/p' overlay/src/osd/wii/wiimain.cpp)
          mkdir -p parts/mame4wii/roms
          cp overlay/src/osd/wii/hbc/README.txt parts/mame4wii/README.txt 2>/dev/null || true
          (cd parts && rm -f ./*.zip && zip -qr "../mame4wii-$VERSION.zip" apps mame4wii)
          echo "ZIP=mame4wii-$VERSION.zip" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: mame4wii
          path: ${{ env.ZIP }}

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP }}
          generate_release_notes: true
